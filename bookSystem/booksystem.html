<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Book Management System</title>
</head>
<body>
    <h1>Book Management System</h1>
    <form id="booksystemForm">
    <label for="bookName">Book Name:</label><br>
    <input type="text" id="bookName" name="name"><br><br>
    <label for="authorName">Author Name:</label><br>
    <textarea id="authorName" rows="4" name="author"></textarea><br><br>
    <label for="bookDescription">Book Description:</label><br>
    <textarea id="bookDescription" rows="4" name="description"></textarea><br><br>
    <label for="pagesNumber">No. of Pages:</label><br>
    <input type="number" id="pagesNumber" name="nopages"><br><br>
    <button type="submit">Add Book</button>
    </form>

    <h2>books</h2>
    <div id="books">
        <!-- books will be displayed here -->
    </div>
    <script src="./book_system.js"></script>
</body>
</html>
